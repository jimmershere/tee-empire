[local81]
version = 0.1
project = tee-empire
default_scope = tee-empire
state_dir = .local81/state
plans_dir = .local81/plans
runs_dir = .local81/runs
logs_dir = .local81/logs
lock_file = .local81/local81.lock
require_plan_for_deploy = true
fail_fast = true
max_parallel = 4
shell = /usr/bin/bash

[tools]
ssh = /usr/bin/ssh
rsync = /usr/bin/rsync
find = /usr/bin/find

[defaults]
rsync_opts = -az
backup = true
backup_suffix = .bkp
remote_mkdir = true
dry_run_default = false
log_hosts =
log_dest_dir = .local81/pulled-logs
jboss_log_path =
apache_log_path =
engin_log_path =
smartxfr_log_path =

[routing]
env_from_filename_prefix = s:sys,q:qa,p:production
env_from_server_name_char_at = 4
env_from_server_name_char_map = s:sys,q:qa,p:production

# No sync scope. tee-empire lives on pop-os ONLY and is deployed nowhere.
#
# This used to push to floor2:/home/floor2/tee-empire with `rsync --delete`.
# floor2 (192.168.1.206) is not part of this fleet and nothing here depends on
# it (TE-10, answered 2026-09-23: "we have no connection to nor dependency to
# floor2 or .206"). A --delete pointed at an unaccountable host is exactly the
# hazard /app/CLAUDE.md forbids, so the scope is removed rather than repointed.
#
# If tee-empire ever needs to run on quasimodo, add a scope deliberately and
# confirm which host owns the data first.
