[local81]
version = 0.1
project = tee-empire
default_scope = tee-empire
state_dir = .local81/state
plans_dir = .local81/plans
runs_dir = .local81/runs
logs_dir = .local81/logs
lock_file = .local81/local81.lock
require_plan_for_deploy = true
fail_fast = true
max_parallel = 4
shell = /usr/bin/bash

[tools]
ssh = /usr/bin/ssh
rsync = /usr/bin/rsync
find = /usr/bin/find

[defaults]
rsync_opts = -az
backup = true
backup_suffix = .bkp
remote_mkdir = true
dry_run_default = false
log_hosts =
log_dest_dir = .local81/pulled-logs
jboss_log_path =
apache_log_path =
engin_log_path =
smartxfr_log_path =

[routing]
env_from_filename_prefix = s:sys,q:qa,p:production
env_from_server_name_char_at = 4
env_from_server_name_char_map = s:sys,q:qa,p:production

[scope "tee-empire"]
enabled = true
source_dir = .
target_dir = /home/floor2/tee-empire
servers = floor2
discovery = mtime_since_last_success
rsync_opts = -az --delete --exclude .local81 --exclude .git --exclude .env --exclude data --exclude inbox --exclude __pycache__
backup = false
backup_suffix = .bkp
